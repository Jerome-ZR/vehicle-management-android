name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Keystore
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "✓ Using permanent keystore"
            echo "$KS" | base64 -d > app/release.keystore
          else
            echo "⚠️ Generating temporary keystore (signature will change each build)"
            keytool -genkeypair \
              -keystore app/release.keystore \
              -alias vehicle \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass vehicle2024 -keypass vehicle2024 \
              -dname "CN=VehicleManager, OU=Dev, O=Vehicle, L=Beijing, ST=Beijing, C=CN"
            base64 -w0 app/release.keystore > ks.b64
            echo "KEYSTORE_BASE64=$(cat ks.b64)" >> $GITHUB_ENV
          fi

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VehicleManager-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk VehicleManager.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: VehicleManager.apk
          generate_release_notes: true
