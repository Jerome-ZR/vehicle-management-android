name: Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using permanent keystore from GitHub Secret"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
          else
            echo "⚠️ No KEYSTORE_BASE64 secret found — generating temporary keystore"
            echo "⚠️ Each build will have a DIFFERENT signature until you save the secret!"
            echo "⚠️ Steps: download the keystore artifact below, then:"
            echo "⚠️   gh secret set KEYSTORE_BASE64 -b\"\$(base64 -i release.keystore)\""
            keytool -genkeypair \
              -keystore app/release.keystore \
              -alias vehicle \
              -keyalg RSA \
              -keysize 2048 \
              -validity 36500 \
              -storepass vehicle2024 \
              -keypass vehicle2024 \
              -dname "CN=VehicleManager, OU=Dev, O=Vehicle, L=Beijing, ST=Beijing, C=CN"
            cp app/release.keystore release.keystore
          fi

      - name: Upload Keystore Artifact (for first-time setup)
        if: ${{ !secrets.KEYSTORE_BASE64 }}
        uses: actions/upload-artifact@v4
        with:
          name: keystore-for-secret-setup
          path: release.keystore
          retention-days: 1

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VehicleManager-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk VehicleManager.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: VehicleManager.apk
          generate_release_notes: true
